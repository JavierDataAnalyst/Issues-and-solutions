# Ejemplo de ejecución diaria en GitHub Actions (no está activo).
# Para activarlo, cópialo a .github/workflows/ en un repositorio propio.
# Las credenciales viven en Settings → Secrets and variables → Actions; nunca en el repositorio.
name: automatizacion-diaria

on:
  schedule:
    - cron: "30 11 * * 1-5"   # 6:30 a. m. en Bogotá (UTC-5), de lunes a viernes
  workflow_dispatch:          # también se puede correr a mano

jobs:
  carga-y-despacho:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python/automatizacion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Pruebas antes de tocar datos reales
        run: python -m unittest test_direcciones.py

      - name: Exportar datos de la API
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          OAUTH_TOKEN_URL: ${{ secrets.OAUTH_TOKEN_URL }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: python cliente_api.py --consulta "SELECT mes, SUM(monto) AS desembolsado FROM prestamos GROUP BY mes" > exportacion.json

      - name: Despachar por SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: "22"
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
          SFTP_KEY_PATH: ${{ runner.temp }}/llave_sftp
          SFTP_KNOWN_HOSTS: ${{ runner.temp }}/known_hosts
        run: |
          printf '%s\n' "${{ secrets.SFTP_PRIVATE_KEY }}" > "$SFTP_KEY_PATH"
          printf '%s\n' "${{ secrets.SFTP_KNOWN_HOSTS }}" > "$SFTP_KNOWN_HOSTS"
          chmod 600 "$SFTP_KEY_PATH"
          python despacho_sftp.py --fecha "$(date +%F)"

      - name: Alerta si no llegaron datos
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERTA_PARA: ${{ secrets.ALERTA_PARA }}
        run: python alerta_sin_datos.py --base estrella.db --tabla fact_llamada --columna fecha
